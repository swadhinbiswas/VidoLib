<svg width="1200" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="120" fill="url(#footerGradient)"/>
  
  <!-- Animated waveform (left) -->
  <g opacity="0.3">
    <rect x="100" y="70" width="2" height="15" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="15;30;15" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;62;70" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" y="65" width="2" height="25" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="25;12;25" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="65;71;65" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="72" width="2" height="10" rx="1" fill="#818CF8">
      <animate attributeName="height" values="10;28;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="72;63;72" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="60" width="2" height="35" rx="1" fill="#818CF8">
      <animate attributeName="height" values="35;18;35" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;68;60" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="140" y="68" width="2" height="20" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="20;38;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="68;59;68" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="75" width="2" height="8" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="8;22;8" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="75;68;75" dur="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Animated waveform (right) -->
  <g opacity="0.3">
    <rect x="1050" y="70" width="2" height="15" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="15;30;15" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;62;70" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1060" y="65" width="2" height="25" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="25;12;25" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="65;71;65" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1070" y="72" width="2" height="10" rx="1" fill="#818CF8">
      <animate attributeName="height" values="10;28;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="72;63;72" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1080" y="60" width="2" height="35" rx="1" fill="#818CF8">
      <animate attributeName="height" values="35;18;35" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;68;60" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1090" y="68" width="2" height="20" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="20;38;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="68;59;68" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1100" y="75" width="2" height="8" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="8;22;8" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="75;68;75" dur="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Floating particles -->
  <circle cx="300" cy="80" r="2" fill="#38BDF8" opacity="0.4">
    <animate attributeName="cy" values="80;60;80" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="70" r="2" fill="#818CF8" opacity="0.5">
    <animate attributeName="cy" values="70;50;70" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="85" r="2" fill="#38BDF8" opacity="0.4">
    <animate attributeName="cy" values="85;65;85" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Footer text -->
  <text x="600" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="400" 
        text-anchor="middle" fill="#64748B" letter-spacing="2">
    BUILT WITH WEBCODECS • WEBGL • WEBGPU • WORKERS
  </text>
  
  <!-- Animated MIT License badge -->
  <g transform="translate(600, 65)">
    <rect x="-60" y="-12" width="120" height="24" rx="12" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="10" font-weight="500" 
          text-anchor="middle" fill="#38BDF8" opacity="0.8">MIT LICENSE</text>
  </g>
  
  <!-- Small mascot waving (bottom-left) -->
  <g transform="translate(50, 85) scale(0.2)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="40" ry="35" fill="#5CE1E6"/>
    <ellipse cx="0" cy="-15" rx="35" ry="30" fill="#5CE1E6"/>
    <ellipse cx="-12" cy="-18" rx="8" ry="10" fill="white"/>
    <ellipse cx="12" cy="-18" rx="8" ry="10" fill="white"/>
    <circle cx="-12" cy="-16" r="4" fill="#1E293B"/>
    <circle cx="12" cy="-16" r="4" fill="#1E293B"/>
    <path d="M -6,-3 Q 0,3 6,-3" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 -35 0;20 -35 0;0 -35 0" dur="0.8s" repeatCount="indefinite"/>
      <ellipse cx="-35" cy="0" rx="10" ry="7" fill="#5CE1E6"/>
    </g>
  </g>
</svg>
