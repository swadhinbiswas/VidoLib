<svg width="1200" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#38BDF8;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#38BDF8;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main line -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="url(#dividerGradient)" stroke-width="1"/>
  
  <!-- Center diamond -->
  <polygon points="600,20 610,30 600,40 590,30" fill="#38BDF8" opacity="0.8"/>
  
  <!-- Side dots -->
  <circle cx="550" cy="30" r="2" fill="#818CF8" opacity="0.6"/>
  <circle cx="650" cy="30" r="2" fill="#818CF8" opacity="0.6"/>
  <circle cx="500" cy="30" r="1.5" fill="#38BDF8" opacity="0.4"/>
  <circle cx="700" cy="30" r="1.5" fill="#38BDF8" opacity="0.4"/>
</svg>
