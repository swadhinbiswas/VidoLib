<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Film strip pattern -->
    <pattern id="filmStrip" x="0" y="0" width="40" height="300" patternUnits="userSpaceOnUse">
      <rect x="5" y="10" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="40" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="70" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="100" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="130" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="160" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="190" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="220" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="250" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
      <rect x="5" y="280" width="30" height="20" rx="2" fill="none" stroke="#334155" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  
  <!-- Film strip decoration (left) -->
  <rect x="0" y="0" width="50" height="300" fill="url(#filmStrip)" opacity="0.3"/>
  
  <!-- Film strip decoration (right) -->
  <rect x="1150" y="0" width="50" height="300" fill="url(#filmStrip)" opacity="0.3"/>
  
  <!-- Decorative circles (media nodes) -->
  <circle cx="100" cy="80" r="40" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="80" r="60" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.15"/>
  <circle cx="1100" cy="220" r="40" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="220" r="60" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.15"/>
  
  <!-- Play button icon (center) -->
  <g transform="translate(600, 100)" filter="url(#glow)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#accentGradient)" stroke-width="2"/>
    <polygon points="-12,-18 -12,18 18,0" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Waveform decoration -->
  <g opacity="0.3">
    <rect x="350" y="180" width="3" height="20" rx="1" fill="#38BDF8"/>
    <rect x="360" y="175" width="3" height="30" rx="1" fill="#38BDF8"/>
    <rect x="370" y="182" width="3" height="15" rx="1" fill="#38BDF8"/>
    <rect x="380" y="170" width="3" height="40" rx="1" fill="#818CF8"/>
    <rect x="390" y="178" width="3" height="25" rx="1" fill="#818CF8"/>
    <rect x="400" y="185" width="3" height="10" rx="1" fill="#38BDF8"/>
    
    <rect x="800" y="180" width="3" height="20" rx="1" fill="#38BDF8"/>
    <rect x="810" y="175" width="3" height="30" rx="1" fill="#38BDF8"/>
    <rect x="820" y="182" width="3" height="15" rx="1" fill="#38BDF8"/>
    <rect x="830" y="170" width="3" height="40" rx="1" fill="#818CF8"/>
    <rect x="840" y="178" width="3" height="25" rx="1" fill="#818CF8"/>
    <rect x="850" y="185" width="3" height="10" rx="1" fill="#38BDF8"/>
  </g>
  
  <!-- Title: VidoLib -->
  <text x="600" y="230" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="56" font-weight="800" text-anchor="middle" fill="#F8FAFC" letter-spacing="-2">
    VidoLib
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="265" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="18" font-weight="400" text-anchor="middle" fill="#94A3B8" letter-spacing="4">
    ZERO-DEPENDENCY BROWSER MEDIA ENGINE
  </text>
  
  <!-- Accent line -->
  <line x1="450" y1="280" x2="750" y2="280" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
</svg>
